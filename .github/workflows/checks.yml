name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q patcher.py patches
      - run: python patcher.py --help
      - run: python -m unittest discover -s tests
      - run: node patches/build-scripts/test-payload.cjs
      - run: node tests/about-marker.cjs
